name: Windows release validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
      - name: Install pinned runtime and test dependencies
        run: |
          python -m pip install -r requirements-lock-win-py312.txt
          python -m pip install -r requirements-dev.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Check runtime imports and required files
        run: python tools/release/smoke_runtime.py
      - name: Run automated suite
        run: python -m pytest -q -p no:cacheprovider
